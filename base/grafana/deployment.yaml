# Grafana is stateless here: datasource and dashboards are provisioned from
# ConfigMaps, so there is no PVC. Edit dashboards in git, not in the UI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:13.2.6
          env:
            # read-only access without logging in
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/backhaul.json}
            - {name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL, value: 1s}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            # Grafana otherwise downloads ~175MB of optional plugins on every
            # start (no persistent volume here) and runs a helper process per
            # plugin, which is enough to OOM the pod
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            # keep the Go heap under the container limit; without this the
            # runtime lets garbage from dashboard queries pile up until the
            # kernel OOM-kills the pod
            - {name: GOMEMLIMIT, value: 600MiB}
            # admin login (for editing) comes from a Secret the overlay provides
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: grafana-admin, key: user}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
          ports:
            - {name: http, containerPort: 3000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {port: http, path: /api/health}
          livenessProbe:
            httpGet: {port: http, path: /api/health}
            initialDelaySeconds: 60
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
      volumes:
        - name: data
          emptyDir: {}
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
