# Host, ingress class and ClusterIssuer are placeholders; overlays patch them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    cert-manager.io/cluster-issuer: REPLACE-ME
spec:
  tls:
    - hosts: [perfmon.example.com]
      secretName: grafana-tls
  rules:
    - host: perfmon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port: {name: http}
