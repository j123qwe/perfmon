apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-default
  namespace: perfmon
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  # Match the ingress class used by the grafana ingress in kustomization.yaml.
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port: {name: http}
