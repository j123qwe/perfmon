# Probe targets (Prometheus file_sd format). This is the file you edit.
#
# Per-target labels:
#   module    (required) probe type; a module name from prober/blackbox.yml
#             icmp | http_2xx | dns_udp | <your own, e.g. icmp_vxlan220>
#   name      (optional) friendly name shown in Grafana; defaults to the target
#   interval  (optional) probe frequency, e.g. 1s, 5s, 30s; default 30s
#   timeout   (optional) per-probe timeout; default min(interval, 5s)
#
# Any other label (e.g. link: mpls) is kept and can be used in dashboards.

- targets: ["1.1.1.1"]
  labels:
    module: icmp
    name: cloudflare
    interval: 30s

